[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Direct API routes to Netlify Functions
[[redirects]]
  from = "/api/nasa/live"
  to = "/.netlify/functions/nasa-live"
  status = 200

[[redirects]]
  from = "/api/gemini/advisory"
  to = "/.netlify/functions/gemini-advisory"
  status = 200

# SPA fallback redirect for React Router / client routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# High-performance caching for 3D textures and static assets
[[headers]]
  for = "/textures/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
